name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host unit tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -o test_logic test/test_distance_logic.cpp
          ./test_logic

  compile-sketch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile for Arduino Uno
        uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          sketch-paths: |
            - parking_assist
          enable-warnings-report: true
